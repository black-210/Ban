[package]
name = "codementor-analyzer"
version = "1.0.0"
edition = "2021"
authors = ["CodeMentor Team <team@codementor.dev>"]
description = "Native Rust analyzer and ownership mental model extractor for CodeMentor VS Code extension"
license = "MIT"

[lib]
name = "codementor_analyzer"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
